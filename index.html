<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор Темщика: С нуля до Гелика</title>
    <style>
        :root {
            --bg-dark: #0f1117;
            --bg-card: #1a1d27;
            --bg-card-hover: #242836;
            --accent: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.35);
            --gold: #ffd740;
            --danger: #ff5252;
            --text-main: #ffffff;
            --text-muted: #8f96a8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Верхняя панель */
        .header {
            background: var(--bg-card);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2f3d;
            z-index: 10;
        }

        .balance-box {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .income-stats {
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
        }

        .income-stats span {
            color: var(--gold);
            font-weight: 700;
        }

        /* Игровая зона по центру */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 16px;
            overflow: hidden;
        }

        /* Прогресс ранга */
        .rank-card {
            background: var(--bg-card);
            padding: 10px 18px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #2a2f3d;
            width: 100%;
            max-width: 360px;
        }

        .rank-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #0f1117;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            transition: width 0.2s ease;
        }

        .rank-next {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Главная кнопка клика */
        .click-btn-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .click-btn {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a3142, #141720);
            border: 4px solid var(--accent);
            box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(0, 230, 118, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.06s ease;
        }

        .click-btn:active {
            transform: scale(0.92);
        }

        .click-emoji {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 6px;
        }

        .click-hint {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* Всплывающие цифры при клике */
        .floating-text {
            position: fixed;
            pointer-events: none;
            font-weight: 800;
            font-size: 20px;
            color: var(--accent);
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
        }

        /* Баннер случайного события */
        .event-banner {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #ff6d00, #ffab00);
            color: #000;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(255, 109, 0, 0.5);
            cursor: pointer;
            z-index: 50;
            width: 90%;
            max-width: 380px;
            justify-content: space-between;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.03); }
        }

        /* Нижняя панель магазина */
        .shop-panel {
            background: var(--bg-card);
            border-top: 1px solid #2a2f3d;
            height: 44dvh;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #2a2f3d;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(0, 230, 118, 0.05);
        }

        .shop-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-item {
            background: var(--bg-dark);
            border: 1px solid #2a2f3d;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .upgrade-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .upgrade-icon {
            font-size: 28px;
            background: var(--bg-card);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .upgrade-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .upgrade-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        .buy-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            min-width: 90px;
            text-align: center;
        }

        .buy-btn:disabled {
            background: #2a2f3d;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .reset-btn {
            background: none;
            border: 1px solid #333;
            color: #666;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-box">
            <span class="balance-label">Баланс темщика</span>
            <span class="balance-value" id="balance">0 ₽</span>
        </div>
        <div class="income-stats">
            <div>Клик: <span id="per-click">+1 ₽</span></div>
            <div>Пассив: <span id="per-sec">0 ₽/сек</span></div>
            <button class="reset-btn" onclick="resetGame()">Сброс</button>
        </div>
    </div>

    <div class="main-stage">
        <div class="event-banner" id="event-banner" onclick="claimEvent()">
            <span id="event-text">🔥 Хайп в ТикТоке! Жми за бонусом!</span>
            <span>ЗАБРАТЬ</span>
        </div>

        <div class="rank-card">
            <div class="rank-title" id="rank-title">Ранг: Школьник на информатике</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="rank-progress"></div>
            </div>
            <div class="rank-next" id="rank-next">До следующего ранга: 500 ₽</div>
        </div>

        <div class="click-btn-wrapper">
            <div class="click-btn" id="click-btn">
                <div class="click-emoji" id="avatar-emoji">🎒</div>
