<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Verity Кликер: Эволюция</title><style>:root{--orange:#f25c19;--panel-bg:rgba(28,30,36,0.92);--card-locked:rgba(68,71,78,0.88);--card-open:rgba(42,46,56,0.95)}*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Arial Black','Segoe UI',Impact,sans-serif}body{width:100vw;height:100dvh;overflow:hidden;display:flex;background:#1a1d24;color:#fff;position:relative}#bg-layer{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;transition:all .6s ease}.outlined{color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 0 #000}.shop-sidebar{position:relative;z-index:10;width:44%;max-width:460px;min-width:270px;height:100%;background:var(--panel-bg);border-right:4px solid #000;display:flex;flex-direction:column}.shop-header{background:linear-gradient(180deg,#ff6f2c 0%,#e04c0b 100%);padding:12px 16px;border-bottom:4px solid #000;display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(20px,3vw,30px);font-weight:900}.shop-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}.item-card{background:var(--card-open);border:3px solid #000;border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;min-height:82px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.6);position:relative}.item-card:active{transform:scale(0.97)}.item-card.locked{background:var(--card-locked);cursor:default}.item-card.cant-afford:not(.locked){opacity:.78}.item-left{display:flex;flex-direction:column;gap:4px;max-width:65%}.item-name{font-size:clamp(14px,1.8vw,18px);font-weight:900;color:#fff;text-shadow:1px 1px 0 #000}.item-card.locked .item-name,.item-card.locked .item-bonus,.item-card.locked .item-price{color:#35383f;text-shadow:none}.item-bonus{font-size:clamp(11px,1.3vw,14px);font-family:'Segoe UI',sans-serif;font-weight:700;color:#a5b1c2}.item-lvl-badge{position:absolute;top:6px;left:10px;font-size:10px;color:#ffcc00;font-family:'Segoe UI',sans-serif;font-weight:800}.item-right{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:78px}.item-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center}.item-card.locked .item-icon{filter:brightness(0);opacity:.85}.item-price{display:flex;align-items:center;gap:4px;font-size:clamp(13px,1.5vw,16px);font-weight:900}.mini-coin{width:18px;height:18px;display:inline-block;vertical-align:middle}.game-area{flex:1;position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 16px}.top-hud{width:100%;display:flex;justify-content:center;position:relative;padding-top:4px}.score-block{display:flex;flex-direction:column;align-items:center;gap:2px}.score-main{display:flex;align-items:center;gap:8px;font-size:clamp(30px,4.5vw,46px);font-weight:900}.score-sub{display:flex;align-items:center;gap:6px;font-size:clamp(15px,2vw,21px);font-weight:900}.x2-btn{position:absolute;right:0;top:0;background:linear-gradient(180deg,#ff6f2c 0%,#d94306 100%);border:3px solid #000;border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 4px 0 #000}.x2-btn.active{background:linear-gradient(180deg,#00e676 0%,#00a152 100%)}.x2-top{display:flex;align-items:center;gap:4px;font-size:clamp(16px,2.2vw,22px);font-weight:900}.x2-label{font-size:10px;font-weight:900;margin-top:-2px}.center-stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%}.main-target{width:clamp(180px,28vw,270px);height:clamp(180px,28vw,270px);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .06s ease;filter:drop-shadow(0 12px 18px rgba(0,0,0,0.65))}.main-target:active{transform:scale(0.89) rotate(-3deg)}.bottom-hud{width:100%;display:flex;align-items:center;justify-content:center;position:relative;padding-bottom:4px}.level-plate{background:#fff;border:4px solid #000;border-radius:12px;padding:6px 26px;font-size:clamp(20px,2.8vw,28px);font-weight:900;color:#000;box-shadow:0 4px 0 rgba(0,0,0,0.5);position:relative;overflow:hidden}.level-progress{position:absolute;left:0;bottom:0;height:5px;background:#f25c19;width:0%;transition:width .15s}.sound-btn{position:absolute;right:0;bottom:0;width:54px;height:54px;background:rgba(0,0,0,0.45);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}.reset-mini{position:absolute;left:0;bottom:0;background:rgba(0,0,0,0.45);border:2px solid rgba(255,255,255,0.4);color:#fff;border-radius:10px;padding:6px 10px;font-size:11px;font-family:'Segoe UI',sans-serif;cursor:pointer}.fly-particle{position:fixed;pointer-events:none;z-index:100;display:flex;align-items:center;gap:4px;font-size:22px;font-weight:900;animation:popFly .85s ease-out forwards}@keyframes popFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-95px) scale(1.25)}}@media(max-width:650px){body{flex-direction:column-reverse}.shop-sidebar{width:100%;max-width:none;height:46dvh;border-right:none;border-top:4px solid #000}.game-area{height:54dvh;padding:10px}.main-target{width:155px;height:155px}}</style></head><body><div id="bg-layer"></div><aside class="shop-sidebar"><div class="shop-header"><span class="outlined">Магазин</span><span>🛒</span></div><div class="shop-list" id="shop-list"></div></aside><main class="game-area"><div class="top-hud"><div class="score-block"><div class="score-main"><span class="outlined" id="score-val">0</span><span id="top-coin-1"></span></div><div class="score-sub"><span class="outlined" id="cps-val">0</span><span id="top-coin-2"></span><span class="outlined">в сек.</span></div></div><button class="x2-btn" id="x2-btn" onclick="triggerX2()"><div class="x2-top"><span class="outlined">x2</span><span id="x2-coin"></span></div><span class="x2-label outlined" id="x2-text">РЕКЛАМА</span></button></div><div class="center-stage"><div class="main-target" id="click-target"></div></div><div class="bottom-hud"><button class="reset-mini" onclick="resetSave()">Сброс</button><div class="level-plate"><span id="lvl-text">Уровень 1</span><div class="level-progress" id="lvl-bar"></div></div><button class="sound-btn" id="sound-btn" onclick="toggleSound()">🔊</button></div></main>
<script>const VERITY_SVG=(v=0)=>{const ex=[``,`<rect x="26" y="34" width="22" height="11" rx="2" fill="#111"/><rect x="52" y="34" width="22" height="11" rx="2" fill="#111"/><line x1="48" y1="39" x2="52" y2="39" stroke="#111" stroke-width="3"/>`,`<polygon points="30,14 40,2 50,12 60,2 70,14" fill="#ff9800" stroke="#000" stroke-width="2.5"/>`,`<circle cx="50" cy="50" r="46" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="8 4"/>`,`<polygon points="28,15 39,1 50,13 61,1 72,15" fill="#ffd700" stroke="#000" stroke-width="3"/><rect x="25" y="33" width="23" height="12" rx="2" fill="#000"/><rect x="52" y="33" width="23" height="12" rx="2" fill="#000"/>`];return`<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="52" r="42" fill="#ffe600" stroke="#000" stroke-width="4"/><ellipse cx="50" cy="36" rx="26" ry="14" fill="#fff566" opacity=".6"/><ellipse cx="38" cy="40" rx="4.5" ry="6.5" fill="#000"/><ellipse cx="62" cy="40" rx="4.5" ry="6.5" fill="#000"/><path d="M 31 58 Q 50 77 69 58 Q 50 66 31 58 Z" fill="#000"/>${ex[v%ex.length]}</svg>`};const ICONS={hand:`<svg viewBox="0 0 64 64" width="42" height="42"><path d="M26 10 v22 h-4 c-4 0-6 3-5 7 l4 13 c1 3 4 5 8 5 h15 c5 0 9-4 9-9 V29 c0-3-2-5-5-5 s-5 2-5 5 v-3 c0-3-2-5-5-5 s-5 2-5 5 v-2 c0-3-2-5-5-5 v-14 c0-3-2-5-4-5 s-4 2-4 5z" fill="#ffcc99" stroke="#000" stroke-width="3"/></svg>`,cursor:`<svg viewBox="0 0 64 64" width="42" height="42"><polygon points="16,10 16,50 27,39 35,55 42,51 34,35 49,35" fill="#fff" stroke="#000" stroke-width="3.5"/></svg>`,can:`<svg viewBox="0 0 64 64" width="42" height="42"><rect x="20" y="10" width="24" height="44" rx="5" fill="#ff9800" stroke="#000" stroke-width="3"/><polygon points="33,18 25,33 32,33 29,46 39,30 32,30" fill="#ffe600"/></svg>`,pc:`<svg viewBox="0 0 64 64" width="42" height="42"><rect x="10" y="12" width="44" height="30" rx="4" fill="#29b6f6" stroke="#000" stroke-width="3"/><rect x="18" y="46" width="28" height="6" rx="2" fill="#cfd8dc" stroke="#000" stroke-width="2.5"/></svg>`,server:`<svg viewBox="0 0 64 64" width="42" height="42"><rect x="14" y="10" width="36" height="44" rx="4" fill="#546e7a" stroke="#000" stroke-width="3"/><circle cx="24" cy="22" r="3" fill="#00e676"/><circle cx="24" cy="34" r="3" fill="#00e676"/><circle cx="24" cy="46" r="3" fill="#ffe600"/></svg>`,car:`<svg viewBox="0 0 64 64" width="42" height="42"><rect x="10" y="28" width="44" height="16" rx="5" fill="#212121" stroke="#000" stroke-width="3"/><polygon points="16,28 22,16 44,16 50,28" fill="#424242" stroke="#000" stroke-width="3"/><circle cx="20" cy="45" r="6" fill="#757575" stroke="#000" stroke-width="3"/><circle cx="44" cy="45" r="6" fill="#757575" stroke="#000" stroke-width="3"/></svg>`,crown:`<svg viewBox="0 0 64 64" width="42" height="42"><polygon points="10,46 14,20 26,32 32,14 38,32 50,20 54,46" fill="#ffd700" stroke="#000" stroke-width="3"/></svg>`};const BGS=["linear-gradient(180deg,#5c8a47 0%,#3d5e2e 55%,#25381c 100%)","linear-gradient(180deg,#4a6fa5 0%,#2c4268 55%,#18243b 100%)","linear-gradient(180deg,#8d5b4c 0%,#59362c 55%,#2e1a14 100%)","linear-gradient(180deg,#4b3b75 0%,#2a2045 55%,#140e24 100%)","linear-gradient(180deg,#b8860b 0%,#6e4f04 55%,#2b1e01 100%)"];const UPGRADES=[{id:'u1',name:'Клик пальцем',desc:'+1 за клик',type:'tap',power:1,cost:15,icon:'hand'},{id:'u2',name:'Автокликер',desc:'+2 в сек.',type:'cps',power:2,cost:50,icon:'cursor'},{id:'u3',name:'Банка энергетика',desc:'+5 за клик',type:'tap',power:5,cost:180,icon:'can'},{id:'u4',name:'Комп в кабинете',desc:'+12 в сек.',type:'cps',power:12,cost:550,icon:'pc'},{id:'u5',name:'Ферма смайлов',desc:'+45 в сек.',type:'cps',power:45,cost:2200,icon:'server'},{id:'u6',name:'Черный Гелик',desc:'+150 за клик',type:'tap',power:150,cost:8500,icon:'car'},{id:'u7',name:'Империя Verity',desc:'+600 в сек.',type:'cps',power:600,cost:32000,icon:'crown'}];let state={score:0,totalScore:0,sound:true,x2Until:0,bought:{}},audioCtx=null;function beep(f=500){if(!state.sound)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(f,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.4,audioCtx.currentTime+0.06);g.gain.setValueAtTime(0.09,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.06);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.06)}catch(e){}}function getRates(){let tap=1,cps=0;UPGRADES.forEach(u=>{const l=state.bought[u.id]||0;if(u.type==='tap')tap+=u.power*l;if(u.type==='cps')cps+=u.power*l});const m=Date.now()<state.x2Until?2:1;return{tap:tap*m,cps:cps*m}}function getCost(u){return Math.floor(u.cost*Math.pow(1.4,state.bought[u.id]||0))}function fmt(n){if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e4)return(n/1e3).toFixed(1)+'K';return Math.floor(n).toString()}function getLvl(){let lvl=1,req=100,prev=0;while(state.totalScore>=req){prev=req;lvl++;req=Math.floor(req*2.3)}return{lvl,pct:Math.min(100,Math.max(0,((state.totalScore-prev)/(req-prev))*100))}}['top-coin-1','top-coin-2','x2-coin'].forEach(id=>document.getElementById(id).innerHTML=`<span class="mini-coin">${VERITY_SVG(0)}</span>`);document.getElementById('click-target').addEventListener('pointerdown',e=>{const r=getRates();state.score+=r.tap;state.totalScore+=r.tap;beep(480+Math.random()*140);const p=document.createElement('div');p.className='fly-particle';p.innerHTML=`<span class="outlined">+${fmt(r.tap)}</span><span style="width:22px;height:22px">${VERITY_SVG(0)}</span>`;p.style.left=(e.clientX-25+(Math.random()-0.5)*40)+'px';p.style.top=(e.clientY-25)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),850);updateUI()});function buyItem(i){const u=UPGRADES[i];if(!(i===0||(state.bought[UPGRADES[i-1].id]||0)>0))return;const c=getCost(u);if(state.score>=c){state.score-=c;state.bought[u.id]=(state.bought[u.id]||0)+1;beep(750);renderShop();updateUI();save()}}function triggerX2(){if(Date.now()<state.x2Until)return;state.x2Until=Date.now()+30000;beep(880);updateUI()}function toggleSound(){state.sound=!state.sound;document.getElementById('sound-btn').textContent=state.sound?'🔊':'🔇';save()}function renderShop(){const l=document.getElementById('shop-list');l.innerHTML='';UPGRADES.forEach((u,i)=>{const lvl=state.bought[u.id]||0,un=i===0||(state.bought[UPGRADES[i-1].id]||0)>0,c=getCost(u),d=document.createElement('div');d.className=`item-card ${un?'':'locked'} ${state.score>=c?'':'cant-afford'}`;d.onclick=()=>buyItem(i);d.innerHTML=`${un&&lvl>0?`<div class="item-lvl-badge">Ур. ${lvl}</div>`:''}<div class="item-left"><div class="item-name">${un?u.name:'???'}</div><div class="item-bonus">${un?u.desc:'???'}</div></div><div class="item-right"><div class="item-icon">${ICONS[u.icon]}</div><div class="item-price"><span class="${un?'outlined':''}">${un?fmt(c):'???'}</span><span class="mini-coin">${VERITY_SVG(0)}</span></div></div>`;l.appendChild(d)})}let curLvl=-1;function updateUI(){const r=getRates();document.getElementById('score-val').textContent=fmt(state.score);document.getElementById('cps-val').textContent=fmt(r.cps);const rem=Math.ceil((state.x2Until-Date.now())/1000),b=document.getElementById('x2-btn');if(rem>0){b.classList.add('active');document.getElementById('x2-text').textContent=rem+' СЕК.'}else{b.classList.remove('active');document.getElementById('x2-text').textContent='РЕКЛАМА'}const li=getLvl();document.getElementById('lvl-text').textContent='Уровень '+li.lvl;document.getElementById('lvl-bar').style.width=li.pct+'%';if(li.lvl!==curLvl){curLvl=li.lvl;document.getElementById('click-target').innerHTML=VERITY_SVG(li.lvl-1);document.getElementById('bg-layer').style.background=BGS[(li.lvl-1)%BGS.length]}const cards=document.querySelectorAll('.item-card');UPGRADES.forEach((u,i)=>{if(cards[i]&&(i===0||(state.bought[UPGRADES[i-1].id]||0)>0))cards[i].classList.toggle('cant-afford',state.score<getCost(u))})}function save(){localStorage.setItem('verity_clicker_v1',JSON.stringify(state))}function resetSave(){if(confirm('Сбросить прогресс?')){localStorage.removeItem('verity_clicker_v1');location.reload()}}try{const s=localStorage.getItem('verity_clicker_v1');if(s)state={...state,...JSON.parse(s)}}catch(e){}document.getElementById('sound-btn').textContent=state.sound?'🔊':'🔇';renderShop();updateUI();setInterval(()=>{const r=getRates();if(r.cps>0){state.score+=r.cps/10;state.totalScore+=r.cps/10}updateUI()},100);setInterval(save,5000);</script></body></html>
