<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Verity Кликер: Эволюция</title><style>:root{--orange:#f25c19;--panel-bg:rgba(24,26,32,0.94);--card-locked:rgba(62,65,72,0.9);--card-open:rgba(40,44,54,0.96)}*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Arial Black','Segoe UI',Impact,sans-serif}body{width:100vw;height:100dvh;overflow:hidden;display:flex;background:#14161c;color:#fff;position:relative}#bg-layer{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;transition:all .7s ease}#flash-overlay{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200;transition:opacity .45s ease-out}#flash-overlay.boom{opacity:.9;transition:none}.outlined{color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 0 #000}.shop-sidebar{position:relative;z-index:10;width:45%;max-width:470px;min-width:280px;height:100%;background:var(--panel-bg);border-right:4px solid #000;display:flex;flex-direction:column}.shop-header{background:linear-gradient(180deg,#ff6f2c 0%,#e04c0b 100%);padding:14px 16px;border-bottom:4px solid #000;display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(20px,2.8vw,28px);font-weight:900;line-height:1.2}.shop-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.item-card{background:var(--card-open);border:3px solid #000;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:86px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.65);position:relative}.item-card:active{transform:scale(0.97)}.item-card.locked{background:var(--card-locked);cursor:default}.item-card.cant-afford:not(.locked){opacity:.8}.item-left{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;padding-top:6px}.item-name{font-size:clamp(13px,1.7vw,17px);font-weight:900;color:#fff;text-shadow:1px 1px 0 #000;line-height:1.25;word-wrap:break-word}.item-card.locked .item-name,.item-card.locked .item-bonus,.item-card.locked .item-price{color:#30333a;text-shadow:none}.item-bonus{font-size:clamp(11px,1.3vw,13px);font-family:'Segoe UI',sans-serif;font-weight:700;color:#b2bec3;line-height:1.2}.item-lvl-badge{position:absolute;top:5px;left:12px;font-size:10px;color:#ffcc00;font-family:'Segoe UI',sans-serif;font-weight:800}.item-right{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:82px;flex-shrink:0}.item-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center}.item-card.locked .item-icon{filter:brightness(0);opacity:.85}.item-price{display:flex;align-items:center;gap:4px;font-size:clamp(13px,1.5vw,16px);font-weight:900;line-height:1.2}.mini-coin{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}.game-area{flex:1;position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 18px}.top-hud{width:100%;display:flex;justify-content:center;position:relative;padding-top:4px}.score-block{display:flex;flex-direction:column;align-items:center;gap:4px}.score-main{display:flex;align-items:center;gap:8px;font-size:clamp(28px,4.2vw,44px);font-weight:900;line-height:1.15}.score-sub{display:flex;align-items:center;gap:6px;font-size:clamp(14px,1.9vw,20px);font-weight:900;line-height:1.2}.x2-btn{position:absolute;right:0;top:0;background:linear-gradient(180deg,#ff6f2c 0%,#d94306 100%);border:3px solid #000;border-radius:14px;padding:7px 12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 4px 0 #000}.x2-btn.active{background:linear-gradient(180deg,#00e676 0%,#00a152 100%)}.x2-top{display:flex;align-items:center;gap:4px;font-size:clamp(15px,2vw,20px);font-weight:900;line-height:1.1}.x2-label{font-size:10px;font-weight:900;margin-top:2px}.center-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:8px}.char-title{background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.25);padding:4px 14px;border-radius:99px;font-size:12px;font-family:'Segoe UI',sans-serif;font-weight:800;color:#ffe600}.main-target{width:clamp(175px,26vw,255px);height:clamp(175px,26vw,255px);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .06s ease;filter:drop-shadow(0 12px 18px rgba(0,0,0,0.7))}.main-target img{width:100%;height:100%;object-fit:contain;pointer-events:none}.main-target:active{transform:scale(0.89) rotate(-3deg)}.bottom-hud{width:100%;display:flex;align-items:center;justify-content:center;position:relative;padding-bottom:6px}.level-plate{background:#fff;border:4px solid #000;border-radius:14px;padding:8px 28px;font-size:clamp(18px,2.5vw,26px);font-weight:900;color:#000;box-shadow:0 4px 0 rgba(0,0,0,0.5);position:relative;overflow:hidden;line-height:1.2}.level-progress{position:absolute;left:0;bottom:0;height:6px;background:#f25c19;width:0%;transition:width .15s}.sound-btn{position:absolute;right:0;bottom:2px;width:52px;height:52px;background:rgba(0,0,0,0.55);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}.reset-mini{position:absolute;left:0;bottom:4px;background:rgba(0,0,0,0.55);border:2px solid rgba(255,255,255,0.4);color:#fff;border-radius:10px;padding:7px 11px;font-size:11px;font-family:'Segoe UI',sans-serif;font-weight:700;cursor:pointer}.fly-particle{position:fixed;pointer-events:none;z-index:100;display:flex;align-items:center;gap:4px;font-size:22px;font-weight:900;animation:popFly .85s ease-out forwards}@keyframes popFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-95px) scale(1.25)}}@media(max-width:650px){body{flex-direction:column-reverse}.shop-sidebar{width:100%;max-width:none;height:47dvh;border-right:none;border-top:4px solid #000}.game-area{height:53dvh;padding:10px}.main-target{width:145px;height:145px}}</style></head><body><div id="bg-layer"></div><div id="flash-overlay"></div><aside class="shop-sidebar"><div class="shop-header"><span class="outlined">Магазин</span><span>🛒</span></div><div class="shop-list" id="shop-list"></div></aside><main class="game-area"><div class="top-hud"><div class="score-block"><div class="score-main"><span class="outlined" id="score-val">0</span><span id="top-coin-1"></span></div><div class="score-sub"><span class="outlined" id="cps-val">0</span><span id="top-coin-2"></span><span class="outlined">в сек.</span></div></div><button class="x2-btn" id="x2-btn" onclick="triggerX2()"><div class="x2-top"><span class="outlined">x2</span><span id="x2-coin"></span></div><span class="x2-label outlined" id="x2-text">РЕКЛАМА</span></button></div><div class="center-stage"><div class="char-title" id="char-name">Verity (Друг из коробки)</div><div class="main-target" id="click-target"></div></div><div class="bottom-hud"><button class="reset-mini" onclick="resetSave()">Сброс</button><div class="level-plate"><span id="lvl-text">Уровень 1</span><div class="level-progress" id="lvl-bar"></div></div><button class="sound-btn" id="sound-btn" onclick="toggleSound()">🔊</button></div></main>
<script>const CHARS=[{name:"Verity (Друг из коробки)",img:"1.png",color:"#ffe600",bgImg:"bg1.jpg",bgGrad:"linear-gradient(180deg,#5d4037 0%,#3e2723 60%,#1b100d 100%)",sad:false,glitch:false},{name:"Glitch Verity (День 3)",img:"2.png",color:"#ffd600",bgImg:"bg2.jpg",bgGrad:"linear-gradient(180deg,#4e6e3a 0%,#2f4522 60%,#162110 100%)",sad:false,glitch:true},{name:"Falsity (Синий антипод)",img:"3.png",color:"#2979ff",bgImg:"bg3.jpg",bgGrad:"linear-gradient(180deg,#283593 0%,#1a237e 60%,#0a0e36 100%)",sad:true,glitch:false},{name:"Cruelty (Красный ярость)",img:"4.png",color:"#ff1744",bgImg:"bg4.jpg",bgGrad:"linear-gradient(180deg,#8e1919 0%,#4a0b0b 60%,#1f0404 100%)",sad:true,glitch:true},{name:"Lovity (Розовый яндере)",img:"5.png",color:"#ff4081",bgImg:"bg5.jpg",bgGrad:"linear-gradient(180deg,#ad1457 0%,#6a0b35 60%,#290314 100%)",sad:false,glitch:false}];function makeVeritySVG(c){const mouth=c.sad?`<path d="M 31 68 Q 50 49 69 68 Q 50 60 31 68 Z" fill="#000"/>`:`<path d="M 31 58 Q 50 77 69 58 Q 50 66 31 58 Z" fill="#000"/>`;const eyes=c.glitch?`<ellipse cx="38" cy="40" rx="6" ry="8" fill="#000"/><circle cx="38" cy="40" r="2" fill="#fff"/><ellipse cx="62" cy="40" rx="6" ry="8" fill="#000"/><circle cx="62" cy="40" r="2" fill="#fff"/>`:`<ellipse cx="38" cy="40" rx="4.5" ry="6.5" fill="#000"/><ellipse cx="62" cy="40" rx="4.5" ry="6.5" fill="#000"/><circle cx="36.5" cy="38" r="1.5" fill="#fff"/><circle cx="60.5" cy="38" r="1.5" fill="#fff"/>`;return`<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="52" r="42" fill="${c.color}" stroke="#000" stroke-width="4"/><ellipse cx="50" cy="36" rx="26" ry="14" fill="#fff" opacity=".28"/>${eyes}${mouth}</svg>`}const ICONS={hand:`<svg viewBox="0 0 64 64" width="40" height="40"><path d="M26 10 v22 h-4 c-4 0-6 3-5 7 l4 13 c1 3 4 5 8 5 h15 c5 0 9-4 9-9 V29 c0-3-2-5-5-5 s-5 2-5 5 v-3 c0-3-2-5-5-5 s-5 2-5 5 v-2 c0-3-2-5-5-5 v-14 c0-3-2-5-4-5 s-4 2-4 5z" fill="#ffcc99" stroke="#000" stroke-width="3"/></svg>`,pick:`<svg viewBox="0 0 64 64" width="40" height="40"><path d="M14 22 Q32 8 50 22 L46 27 Q32 16 18 27 Z" fill="#cfd8dc" stroke="#000" stroke-width="3"/><rect x="30" y="18" width="4" height="36" rx="2" fill="#8d6e63" stroke="#000" stroke-width="2.5"/></svg>`,sword:`<svg viewBox="0 0 64 64" width="40" height="40"><polygon points="46,10 54,18 28,44 20,36" fill="#00e5ff" stroke="#000" stroke-width="3"/><rect x="15" y="34" width="16" height="5" rx="2" transform="rotate(45 23 36)" fill="#ffd700" stroke="#000" stroke-width="2.5"/><rect x="11" y="45" width="8" height="8" rx="2" fill="#8d6e63" stroke="#000" stroke-width="2.5"/></svg>`,box:`<svg viewBox="0 0 64 64" width="40" height="40"><rect x="12" y="16" width="40" height="36" rx="4" fill="#d7ccc8" stroke="#000" stroke-width="3"/><line x1="12" y1="28" x2="52" y2="28" stroke="#000" stroke-width="3"/><circle cx="32" cy="40" r="6" fill="#ffe600" stroke="#000" stroke-width="2"/></svg>`,portal:`<svg viewBox="0 0 64 64" width="40" height="40"><rect x="14" y="8" width="36" height="48" rx="4" fill="#212121" stroke="#000" stroke-width="3"/><rect x="21" y="15" width="22" height="34" fill="#aa00ff"/></svg>`,block:`<svg viewBox="0 0 64 64" width="40" height="40"><rect x="12" y="12" width="40" height="40" rx="5" fill="#18ffff" stroke="#000" stroke-width="3"/><rect x="18" y="18" width="12" height="12" fill="#fff" opacity=".6"/></svg>`,crown:`<svg viewBox="0 0 64 64" width="40" height="40"><polygon points="10,46 14,20 26,32 32,14 38,32 50,20 54,46" fill="#ffd700" stroke="#000" stroke-width="3"/></svg>`};const UPGRADES=[{id:'u1',name:'Верити Клик',desc:'+1 за клик',type:'tap',power:1,cost:15,icon:'hand'},{id:'u2',name:'Железная кирка',desc:'+2 в сек.',type:'cps',power:2,cost:50,icon:'pick'},{id:'u3',name:'Алмазный меч',desc:'+6 за клик',type:'tap',power:6,cost:180,icon:'sword'},{id:'u4',name:'Коробка Верити',desc:'+15 в сек.',type:'cps',power:15,cost:550,icon:'box'},{id:'u5',name:'Портал в Незер',desc:'+50 в сек.',type:'cps',power:50,cost:2200,icon:'portal'},{id:'u6',name:'Алмазный блок',desc:'+180 за клик',type:'tap',power:180,cost:8500,icon:'block'},{id:'u7',name:'Креатив-режим',desc:'+750 в сек.',type:'cps',power:750,cost:32000,icon:'crown'}];let state={score:0,totalScore:0,sound:true,x2Until:0,bought:{}},audioCtx=null;function playTone(f1,f2,dur=0.07,type='sine'){if(!state.sound)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f1,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(f2,audioCtx.currentTime+dur);g.gain.setValueAtTime(0.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}function playLevelUp(){playTone(440,880,0.18,'triangle');setTimeout(()=>playTone(660,1320,0.28,'triangle'),110);const fl=document.getElementById('flash-overlay');fl.classList.add('boom');setTimeout(()=>fl.classList.remove('boom'),60)}function getMult(){return Date.now()<state.x2Until?2:1}function getRates(){let tap=1,cps=0;UPGRADES.forEach(u=>{const l=state.bought[u.id]||0;if(u.type==='tap')tap+=u.power*l;if(u.type==='cps')cps+=u.power*l});const m=getMult();return{tap:tap*m,cps:cps*m}}function getCost(u){return Math.floor(u.cost*Math.pow(1.4,state.bought[u.id]||0))}function fmt(n){if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e4)return(n/1e3).toFixed(1)+'K';return Math.floor(n).toString()}function getLvl(){let lvl=1,req=100,prev=0;while(state.totalScore>=req){prev=req;lvl++;req=Math.floor(req*2.4)}return{lvl,pct:Math.min(100,Math.max(0,((state.totalScore-prev)/(req-prev))*100))}}const coinSVG=makeVeritySVG(CHARS);['top-coin-1','top-coin-2','x2-coin'].forEach(id=>document.getElementById(id).innerHTML=`<span class="mini-coin">${coinSVG}</span>`);document.getElementById('click-target').addEventListener('pointerdown',e=>{const r=getRates();state.score+=r.tap;state.totalScore+=r.tap;playTone(480+Math.random()*140,720,0.06);const p=document.createElement('div');p.className='fly-particle';p.innerHTML=`<span class="outlined">+${fmt(r.tap)}</span><span style="width:22px;height:22px">${coinSVG}</span>`;p.style.left=(e.clientX-25+(Math.random()-0.5)*40)+'px';p.style.top=(e.clientY-25)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),850);updateUI()});function buyItem(i){const u=UPGRADES[i];if(!(i===0||(state.bought[UPGRADES[i-1].id]||0)>0))return;const c=getCost(u);if(state.score>=c){state.score-=c;state.bought[u.id]=(state.bought[u.id]||0)+1;playTone(600,950,0.09);renderShop();updateUI();save()}}function triggerX2(){if(Date.now()<state.x2Until)return;state.x2Until=Date.now()+30000;playTone(700,1100,0.12);updateUI()}function toggleSound(){state.sound=!state.sound;document.getElementById('sound-btn').textContent=state.sound?'🔊':'🔇';save()}function renderShop(){const l=document.getElementById('shop-list');l.innerHTML='';UPGRADES.forEach((u,i)=>{const lvl=state.bought[u.id]||0,un=i===0||(state.bought[UPGRADES[i-1].id]||0)>0,c=getCost(u),d=document.createElement('div');d.className=`item-card ${un?'':'locked'} ${state.score>=c?'':'cant-afford'}`;d.onclick=()=>buyItem(i);d.innerHTML=`${un&&lvl>0?`<div class="item-lvl-badge">Ур. ${lvl}</div>`:''}<div class="item-left"><div class="item-name">${un?u.name:'???'}</div><div class="item-bonus">${un?u.desc:'???'}</div></div><div class="item-right"><div class="item-icon">${ICONS[u.icon]}</div><div class="item-price"><span class="${un?'outlined':''}">${un?fmt(c):'???'}</span><span class="mini-coin">${coinSVG}</span></div></div>`;l.appendChild(d)})}function applyStage(idx,withEffect){const ch=CHARS[idx%CHARS.length];document.getElementById('char-name').textContent=ch.name;const target=document.getElementById('click-target');const img=new Image();img.onload=()=>{target.innerHTML='';target.appendChild(img)};img.onerror=()=>{target.innerHTML=makeVeritySVG(ch)};img.src=ch.img;const bgEl=document.getElementById('bg-layer');const bgTest=new Image();bgTest.onload=()=>{bgEl.style.backgroundImage=`url('${ch.bgImg}')`};bgTest.onerror=()=>{bgEl.style.backgroundImage=ch.bgGrad};bgTest.src=ch.bgImg;if(withEffect)playLevelUp()}let curLvl=-1;function updateUI(){const r=getRates();document.getElementById('score-val').textContent=fmt(state.score);document.getElementById('cps-val').textContent=fmt(r.cps);const rem=Math.ceil((state.x2Until-Date.now())/1000),b=document.getElementById('x2-btn');if(rem>0){b.classList.add('active');document.getElementById('x2-text').textContent=rem+' СЕК.'}else{b.classList.remove('active');document.getElementById('x2-text').textContent='РЕКЛАМА'}const li=getLvl();document.getElementById('lvl-text').textContent='Уровень '+li.lvl;document.getElementById('lvl-bar').style.width=li.pct+'%';if(li.lvl!==curLvl){const isUp=curLvl!==-1;curLvl=li.lvl;applyStage(li.lvl-1,isUp)}const cards=document.querySelectorAll('.item-card');UPGRADES.forEach((u,i)=>{if(cards[i]&&(i===0||(state.bought[UPGRADES[i-1].id]||0)>0))cards[i].classList.toggle('cant-afford',state.score<getCost(u))})}function save(){localStorage.setItem('verity_clicker_v2',JSON.stringify(state))}function resetSave(){if(confirm('Сбросить прогресс?')){localStorage.removeItem('verity_clicker_v2');location.reload()}}try{const s=localStorage.getItem('verity_clicker_v2');if(s)state={...state,...JSON.parse(s)}}catch(e){}document.getElementById('sound-btn').textContent=state.sound?'🔊':'🔇';renderShop();updateUI();setInterval(()=>{const r=getRates();if(r.cps>0){state.score+=r.cps/10;state.totalScore+=r.cps/10}updateUI()},100);setInterval(save,5000);</script></body></html>
